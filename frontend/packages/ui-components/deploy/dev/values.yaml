# Stakater Application Chart values for core3-storybook
# Based on https://github.com/stakater/application/tree/v6.2.1
# Development environment configuration

applicationName: "core3-storybook"

serviceAccount:
  enabled: true

externalSecret:
  enabled: false

deployment:
  enabled: true
  image:
    repository: europe-west3-docker.pkg.dev/securityai/securityai/core3-storybook
    tag: "latest"
    pullPolicy: Always

  reloadOnChange: true

  replicaCount: 1

  containerSecurityContext:
    runAsNonRoot: false
    readOnlyRootFilesystem: false

  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 32Mi

  ports:
    - name: http
      containerPort: 80
      protocol: TCP

  livenessProbe:
    enabled: true
    initialDelaySeconds: 10
    failureThreshold: 5
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 3
    httpGet:
      path: /
      port: 80

  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    failureThreshold: 5
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 3
    httpGet:
      path: /
      port: 80

  nodeSelector:
    cloud.google.com/gke-nodepool: pool-1

service:
  enabled: true
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  type: ClusterIP

ingress:
  enabled: true
  ingressClassName: "nginx"
  annotations:
    cert-manager.io/issuer: cloudflare-origin-ca-cluster
    cert-manager.io/issuer-kind: ClusterOriginIssuer
    cert-manager.io/issuer-group: cert-manager.k8s.cloudflare.com
    cert-manager.io/duration: "576h"       # 24 days
    cert-manager.io/renew-before: "168h"   # 7 days before expiry
  hosts:
    - host: storybook.core3.io
      paths:
        - path: /
          pathType: Prefix
          port: http
  tls:
    - secretName: storybook-core3-io-tls
      hosts:
        - storybook.core3.io

autoscaling:
  enabled: false
